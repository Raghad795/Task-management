<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Task Manager</h1> 
    </header>
    <form>
        <div class="title">
            <label for="title">Title: </label>
            <input id="title" name="title" type="text" placeholder="Enter the title" required>
        </div>
        <div class="description">
            <label for="description">Description: </label>
            <textarea name="description" id="description" rows="4"></textarea>
        </div>
        <div class="date">
            <label for="date">Date</label>
            <input id="date" name="date" type="date" required>
        </div>
            <fieldset class="priority">
                <legend>Priority:</legend>
                <input id="high" name="priority" value="high" type="radio">
                <label for="high" >High</label>
                <input id="medium" name="priority" value="medium" type="radio" checked>
                <label for="medium">Medium</label>
                <input id="low" name="priority" value="low" type="radio">
                <label for="low">Low</label>
            </fieldset>
        <button class="btn-addTask" type="submit">Add Task</button>
    </form>

        <div class="tasks-container">
            <div class="tasks pending-tasks">
                <h3>Pending Tasks</h3>
                <div class="task pending-task">
                <h3>Task Title</h3>
                    <p>Description of the task...</p>
                    <p><strong>Date:</strong> 2023-10-15</p>
                    <p><strong>Priority:</strong> Medium</p>
                    <button class="btn btn-complete">Complete</button>
                    <button class="btn btn-edit">Edit</button>
                    <button class="btn btn-delete">Delete</button>
                </div>
            </div>
            <div class="tasks completed-tasks">
                <h3>Completed Tasks</h3>
                <div class="task completed-task">
                    <h4>Task Title</h4>
                    <p>Description of the completed task...</p>
                    <p><strong>Date:</strong> 2023-10-10</p>
                    <p><strong>Priority:</strong> High</p>
                    <button class="btn btn-delete">Delete</button>
                </div>
            </div>
        </div>
</body>
</html>
