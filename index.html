<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Task Manager</h1> 
    </header>
    <form id="task-form">
        <div class="title">
            <label for="title">Title: </label>
            <input id="title" name="title" type="text" value="" placeholder="Enter the title" required>
        </div>
        <div class="description">
            <label for="description">Description: </label>
            <textarea name="description" id="description" rows="4"></textarea>
        </div>
        <div class="date">
            <label for="date">Date</label>
            <input id="date" name="date" type="date" required>
        </div>
            <fieldset class="priority" id="priority">
                <legend>Priority:</legend>
                <input id="high" name="priority" value="high" type="radio">
                <label for="high" >High</label>
                <input id="medium" name="priority" value="medium" type="radio" checked>
                <label for="medium">Medium</label>
                <input id="low" name="priority" value="low" type="radio">
                <label for="low">Low</label>
            </fieldset>
        <button class="btn-addTask" type="submit">Add Task</button>
    </form>

    <!-- add search bar with icon -->
    <div class="search-bar">
        <input class="search-input" type="text" id="search-input" placeholder="Search tasks...">
        <span class="search-icon">🔍</span>
        <!-- add status filter and priority filter -->
        <select class="status-filter" id="status-filter">
            <option value="all">All Tasks</option>
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
        </select>
        <select class="priority-filter" id="priority-filter">
            <option value="all">All Priorities</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
        </select>
    </div>
        <div class="tasks-container">
            <div class="tasks pending-tasks">
                <h3>Pending Tasks</h3>
                <div id="pending-task-list">
                    <!-- add here tasks -->
                </div>
            </div>
            <div class="tasks completed-tasks">
                <h3>Completed Tasks</h3>
                <div id="completed-task-list"></div>
            </div>
        </div>
        <script src="js/index.js"></script>
</body>
</html>
